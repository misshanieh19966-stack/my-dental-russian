<style>
:root{color-scheme:dark;--bg:#15111e;--panel:#241c31;--panel2:#2e2440;--border:#4a395e;--text:#f6f0fc;--muted:#bdafcc;--accent:#ba8bed;--accent2:#e0c1ff;--mint:#a4e2cb;--orange:#ffd3a3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}.app{max-width:640px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;padding:23px 0 18px}header strong{font-size:18px}header small{display:block;color:var(--muted);font-size:12px}h1{font-size:29px;line-height:1.2;margin:0 0 9px}h2{font-size:20px;margin:0 0 14px}h3{font-size:17px;margin:0 0 8px}p{margin:7px 0}.muted{color:var(--muted)}.tiny{font-size:12px}.tag{font-size:11px;padding:5px 10px;border-radius:99px;border:1px solid var(--border);color:var(--accent2)}.hero{background:linear-gradient(135deg,#3e2a58,#251c35 75%);padding:22px;border:1px solid #694983;border-radius:23px;margin:2px 0 16px}.hero p{color:#ded2e8}.progress{height:9px;border-radius:99px;background:#514063;overflow:hidden;margin:13px 0 6px}.progress span{display:block;background:linear-gradient(90deg,#b487f2,#96dfcb);height:100%;transition:width .2s}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile,.card{border:1px solid var(--border);background:var(--panel);border-radius:19px}.tile{padding:17px;min-height:119px;text-align:left;color:var(--text)}.tile .ico{font-size:24px;display:block;margin-bottom:7px}.tile b{display:block;font-size:14px}.tile small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.card{padding:17px;margin:11px 0}.action,.secondary,.chip,.iconbtn{border:1px solid #644783;background:#50366e;color:#fff;border-radius:13px;padding:10px 13px}.action{background:var(--accent);color:#1d1428;border:none;font-weight:700}.secondary{background:var(--panel2)}.iconbtn{width:43px;height:43px;padding:6px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.chip{font-size:12px;padding:7px 10px;background:var(--panel2)}.chip.active{background:var(--accent);color:#20162b;font-weight:700}.russian{font-size:20px;font-weight:700;line-height:1.4}.translation{color:#e2d4ed;font-size:14px}.line{padding:13px 0;border-bottom:1px solid var(--border)}.line:last-child{border-bottom:0}.speaker{font-size:11px;color:var(--mint);letter-spacing:.04em;text-transform:uppercase}.status{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.status button{border:1px solid var(--border);border-radius:10px;padding:8px;background:#342946;color:var(--text);font-size:12px}.status button.chosen{background:var(--accent);color:#1b1027}.item{display:flex;justify-content:space-between;gap:12px;align-items:center}.item .emoji{display:grid;place-items:center;width:58px;height:58px;border:1px solid var(--border);background:#3d2c52;border-radius:15px;font-size:27px;flex-shrink:0}.topbar{margin-bottom:18px}.back{border:0;background:none;color:var(--accent2);padding:9px 0}nav{position:fixed;bottom:0;left:0;right:0;background:rgba(26,20,37,.97);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:11px 5px calc(11px + env(safe-area-inset-bottom));z-index:10}nav button{color:var(--muted);font-size:11px;border:0;background:transparent;padding:3px 9px;min-width:65px}nav button b{display:block;font-size:20px;font-weight:400}nav button.active{color:var(--accent2)}input,textarea,select{background:#1d1728;color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px;width:100%}textarea{min-height:95px;resize:vertical}label{display:block;margin:12px 0 5px;color:var(--muted)}.quizbtn{width:100%;text-align:left;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:13px;margin:5px 0}.quizbtn.correct{border-color:var(--mint);background:#235345}.quizbtn.wrong{border-color:#f7a2ae;background:#5c2b42}.notice{background:#2d3b37;border:1px solid #476958;padding:13px;border-radius:13px;margin:12px 0}.empty{padding:30px 12px;text-align:center;color:var(--muted)}.pill{background:#3a2b4c;border-radius:99px;padding:4px 9px;font-size:11px;color:var(--accent2)}.section{margin-top:24px}footer{text-align:center;color:#8e809d;font-size:11px;padding:28px 0 5px}svg{vertical-align:middle}.hide{display:none!important}@media(min-width:600px){.app{padding-left:25px;padding-right:25px}.tile{min-height:130px}}

<body><div class="app"><header><div><strong>🦷 My Dental Russian</strong><small>Russian • English • Personal learning</small></div><span class="tag">FREE EDITION</span></header><main id="main"></main><footer>Private study edition • Your progress stays in this browser</footer></div><nav id="nav" aria-label="Main navigation"></nav>
<script>
'use strict';
const dialogues=[
{id:'d1',title:'Welcoming a patient',cat:'Assistant & Patient',desc:'Greeting and seating a patient',lines:[['Assistant','Здравствуйте! Проходите, пожалуйста.','Hello! Please come in.'],['Patient','Здравствуйте.','Hello.'],['Assistant','Присаживайтесь в кресло, пожалуйста.','Please have a seat in the dental chair.'],['Assistant','Вам удобно?','Are you comfortable?'],['Patient','Да, спасибо.','Yes, thank you.']]},
{id:'d2',title:'Preparing the treatment room',cat:'Assistant & Dentist',desc:'Instruments and chairside requests',lines:[['Dentist','Подготовьте, пожалуйста, зеркало и зонд.','Please prepare the mirror and probe.'],['Assistant','Хорошо, сейчас подготовлю.','Sure, I will prepare them now.'],['Dentist','Подайте, пожалуйста, слюноотсос.','Please pass the saliva ejector.'],['Assistant','Вот, пожалуйста.','Here you go.'],['Dentist','Спасибо.','Thank you.']]},
{id:'d3',title:'Taking a medical history',cat:'Assistant & Patient',desc:'Allergies and medications',lines:[['Assistant','У вас есть аллергия на лекарства?','Do you have any allergies to medications?'],['Patient','Нет, насколько я знаю.','No, not as far as I know.'],['Assistant','Какие лекарства вы сейчас принимаете?','What medications are you currently taking?'],['Patient','Сейчас ничего не принимаю.','I am not taking anything at the moment.']]},
{id:'d4',title:'During a filling',cat:'Assistant & Dentist',desc:'Composite treatment workflow',lines:[['Dentist','Подайте, пожалуйста, протравочный гель.','Please pass the etching gel.'],['Assistant','Пожалуйста.','Here you go.'],['Dentist','Теперь адгезив.','Now the bonding agent.'],['Assistant','Готово.','Ready.'],['Dentist','Включите полимеризационную лампу.','Switch on the curing light.']]},
{id:'d5',title:'Making an appointment',cat:'Reception & Patient',desc:'Scheduling a dental visit',lines:[['Receptionist','Добрый день! Чем могу помочь?','Good afternoon! How can I help?'],['Patient','Я хочу записаться к стоматологу.','I would like to make an appointment with a dentist.'],['Receptionist','На какой день вам удобно?','Which day works for you?'],['Patient','На пятницу, если возможно.','Friday, if possible.']]},
{id:'d6',title:'Sterilization instructions',cat:'Assistant & Colleague',desc:'Instrument processing',lines:[['Colleague','Эти инструменты уже простерилизованы?','Have these instruments already been sterilized?'],['Assistant','Да, они в стерильной упаковке.','Yes, they are in sterile packaging.'],['Colleague','А эти?','And these?'],['Assistant','Их нужно обработать.','These need to be processed.']]},
{id:'d7',title:'Dental job interview',cat:'Job Interview',desc:'Experience and responsibilities',lines:[['Interviewer','У вас есть опыт работы ассистентом стоматолога?','Do you have experience working as a dental assistant?'],['Candidate','Да, я работала ассистентом стоматолога.','Yes, I have worked as a dental assistant.'],['Interviewer','Вы знакомы с работой в четыре руки?','Are you familiar with four-handed dentistry?'],['Candidate','Да, я умею работать в четыре руки.','Yes, I know how to work using the four-handed technique.']]},
{id:'d8',title:'After the procedure',cat:'Assistant & Patient',desc:'Simple aftercare communication',lines:[['Assistant','Лечение закончено.','The treatment is finished.'],['Assistant','Можете медленно встать.','You can get up slowly.'],['Patient','Спасибо.','Thank you.'],['Assistant','Следуйте рекомендациям врача, пожалуйста.','Please follow the dentist’s instructions.']]}];
const instruments=[
['i1','Стоматологическое зеркало','Dental mirror','Examination','🪞','Allows indirect vision and helps retract soft tissues.'],['i2','Стоматологический зонд','Dental explorer','Examination','🔎','Used to examine tooth surfaces.'],['i3','Пародонтальный зонд','Periodontal probe','Examination','📏','Measures periodontal pocket depth.'],['i4','Стоматологический пинцет','College tweezers','Examination','✂️','Holds small items such as cotton rolls.'],['i5','Слюноотсос','Saliva ejector','Chairside','💧','Removes saliva during treatment.'],['i6','Пылесос (высокообъёмный аспиратор)','High-volume evacuator','Chairside','🌬️','Removes fluids and aerosols near the operating field.'],['i7','Воздушно-водяной пистолет','Air-water syringe','Chairside','🚿','Delivers air, water or spray.'],['i8','Полимеризационная лампа','Curing light','Restorative','🔦','Light-cures suitable dental resin materials.'],['i9','Матрица','Matrix band','Restorative','🦷','Helps shape a restoration’s proximal wall.'],['i10','Клин','Dental wedge','Restorative','🔺','Helps adapt a matrix at the gingival margin.'],['i11','Экскаватор','Spoon excavator','Restorative','🥄','Used to remove soft carious dentin when indicated.'],['i12','Шпатель для композита','Composite placement instrument','Restorative','🛠️','Places and shapes composite material.'],['i13','Коффердам','Rubber dam','Isolation','🟦','Isolates the working field.'],['i14','Кламп для коффердама','Rubber dam clamp','Isolation','🔗','Secures rubber dam around a tooth.'],['i15','Эндодонтический файл','Endodontic file','Endodontics','〰️','Shapes and cleans root canals.'],['i16','Апекслокатор','Apex locator','Endodontics','📟','Helps determine root canal working length.'],['i17','Щипцы для удаления зубов','Extraction forceps','Surgery','🗜️','Grasps a tooth during extraction.'],['i18','Элеватор','Dental elevator','Surgery','🔧','Helps luxate teeth or root fragments.'],['i19','Оттискная ложка','Impression tray','Prosthodontics','🥣','Holds impression material during impression taking.'],['i20','Имплантовод','Implant driver','Implantology','🔩','Used with a compatible implant system to place an implant.']
].map(([id,ru,en,cat,emoji,desc])=>({id,ru,en,cat,emoji,desc}));
const expressions=[
['e1','Откройте рот, пожалуйста.','Please open your mouth.','Patient communication'],['e2','Закройте рот, пожалуйста.','Please close your mouth.','Patient communication'],['e3','Поверните голову вправо.','Turn your head to the right.','Patient communication'],['e4','Поверните голову влево.','Turn your head to the left.','Patient communication'],['e5','Вам больно?','Does it hurt?','Patient communication'],['e6','Поднимите руку, если будет больно.','Raise your hand if it hurts.','Patient communication'],['e7','Прополощите рот, пожалуйста.','Please rinse your mouth.','Patient communication'],['e8','Не двигайтесь, пожалуйста.','Please do not move.','Patient communication'],['e9','Подайте зеркало, пожалуйста.','Please pass the mirror.','Chairside'],['e10','Включите аспиратор.','Turn on the suction.','Chairside'],['e11','Подготовьте анестетик.','Prepare the anesthetic.','Chairside'],['e12','Нужна новая пара перчаток.','We need a new pair of gloves.','Chairside'],['e13','Инструменты стерильные.','The instruments are sterile.','Sterilization'],['e14','Положите инструменты в контейнер.','Put the instruments into the container.','Sterilization'],['e15','Запишитесь на повторный приём.','Book a follow-up appointment.','Reception'],['e16','У вас есть запись?','Do you have an appointment?','Reception'],['e17','Вы принимаете какие-нибудь лекарства?','Are you taking any medications?','Medical history'],['e18','У вас есть аллергия?','Do you have any allergies?','Medical history']
].map(([id,ru,en,cat])=>({id,ru,en,cat}));
const vocab=[...instruments,...expressions];const statuses=['New','Know it','Review','Need practice'];const key='myDentalRussian_v1';const defaultState={status:{},saved:[],notes:[],done:[],last:null,quizAttempts:0,quizCorrect:0};let state;try{state={...defaultState,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{state={...defaultState}};let page='home',detail=null,category='All',filter='All',quiz=null,quizFeedback=null,studyMinutes=20;
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{toast('Storage unavailable. Use Export backup.')}}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(msg){let t=document.createElement('div');t.textContent=msg;t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#e0c1ff;color:#241633;border-radius:12px;padding:12px 17px;z-index:99;max-width:90%;box-shadow:0 8px 30px #0007';document.body.append(t);setTimeout(()=>t.remove(),2300)}function speak(text){if(!('speechSynthesis'in window)){toast('Speech playback is not available in this browser.');return}speechSynthesis.cancel();let utterance=new SpeechSynthesisUtterance(text);utterance.lang='ru-RU';utterance.rate=.83;const voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase()==='ru-ru')||voices.find(v=>v.lang.toLowerCase().startsWith('ru'));if(v)utterance.voice=v;speechSynthesis.speak(utterance)}function pct(){let marked=vocab.filter(x=>state.status[x.id]==='Know it').length;return Math.round(marked/vocab.length*100)}function button(text,action,cls='secondary'){return `<button class="${cls}" data-action="${action}">${text}</button>`}function go(p,id){page=p;detail=id||null;category='All';filter='All';render();scrollTo({top:0,behavior:'instant'})}function heading(title,sub){return `<div class="topbar">${button('← Back','back','back')}<h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}</div>`}function statusButtons(id){return `<div class="status">${statuses.slice(1).map(s=>`<button data-status="${esc(s)}" data-id="${id}" class="${state.status[id]===s?'chosen':''}">${esc(s)}</button>`).join('')}</div>`}function saveButton(id){return `<button class="secondary" data-save="${id}">${state.saved.includes(id)?'★ Saved':'☆ Save'}</button>`}function speakButton(t){return `<button class="secondary" data-speak="${encodeURIComponent(t)}" aria-label="Play Russian pronunciation">▶ Listen</button>`}function groups(items,fn){return items.map(fn).join('')||'<div class="empty">No items match this filter yet.</div>'}function filters(cats,current,prop){return `<div class="chips">${cats.map(c=>`<button class="chip ${current===c?'active':''}" data-${prop}="${esc(c)}">${esc(c)}</button>`).join('')}</div>`}
function home(){return `<div class="hero"><p class="tiny">YOUR PERSONAL STUDY SPACE</p><h1>Добро пожаловать! 👋</h1><p>Learn practical Russian for the dental clinic, one lesson at a time.</p><div class="progress"><span style="width:${pct()}%"></span></div><div class="row between"><span class="tiny">${pct()}% vocabulary mastered</span><span class="pill">${state.done.length}/${dialogues.length} dialogues completed</span></div></div><div class="grid">${[['💬','Dialogues','Clinical conversations','dialogues'],['🦷','Instruments','Tools & materials','instruments'],['📖','Expressions','Useful Russian phrases','expressions'],['🧠','Quiz','Test your knowledge','quiz'],['📓','My Notebook','Saved words & notes','notebook'],['🗓️','Study Plan','Your daily routine','plan']].map(x=>`<button class="tile" data-go="${x[3]}"><span class="ico">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div><div class="section card"><h3>▶ Continue learning</h3><p class="muted">${state.last?esc(dialogues.find(d=>d.id===state.last)?.title||'Lesson'):'Start with a practical conversation at the clinic.'}</p>${button('Open lesson','continue','action')}</div>`}
function dialogueList(){let cats=['All',...new Set(dialogues.map(d=>d.cat))];return heading('Dialogues','Real conversations for dental assistants.')+filters(cats,category,'cat')+groups(dialogues.filter(d=>category==='All'||d.cat===category),d=>`<button style="width:100%;color:inherit;text-align:left" class="card" data-dialogue="${d.id}"><div class="row between"><span class="pill">${esc(d.cat)}</span>${state.done.includes(d.id)?'<span style="color:var(--mint)">✓ Completed</span>':''}</div><h3 style="margin-top:12px">${esc(d.title)}</h3><p class="muted">${esc(d.desc)} • ${d.lines.length} lines</p></button>`)}
function dialogueView(){let d=dialogues.find(x=>x.id===detail);if(!d)return dialogueList();return heading(esc(d.title),esc(d.desc))+`<div class="card"><span class="pill">${esc(d.cat)}</span>${d.lines.map(([who,ru,en])=>`<div class="line"><div class="speaker">${esc(who)}</div><p class="russian" lang="ru">${esc(ru)}</p><p class="translation">${esc(en)}</p>${speakButton(ru)}</div>`).join('')}</div><div class="card"><div class="row between"><b>Lesson progress</b><span class="pill">${state.done.includes(d.id)?'Completed':'Not completed'}</span></div><p class="muted tiny">Read the lines aloud, then repeat without looking at the translation.</p>${button(state.done.includes(d.id)?'✓ Completed — mark incomplete':'✓ Mark lesson complete','complete','action')}</div>`}
function itemList(type){let inst=type==='instruments',items=inst?instruments:expressions,title=inst?'Dental Instruments':'Useful Expressions',cats=['All',...new Set(items.map(x=>x.cat))],activeItems=items.filter(x=>(category==='All'||x.cat===category)&&(filter==='All'||(filter==='New'?!state.status[x.id]:state.status[x.id]===filter)));return heading(title,inst?'Learn Russian names, usage and pronunciation.':'Everyday and chairside phrases.')+filters(cats,category,'cat')+filters(['All',...statuses],filter,'filter')+`<p class="muted tiny">Showing ${activeItems.length} of ${items.length} items</p>`+groups(activeItems,x=>`<div class="card"><div class="item">${inst?`<div class="emoji" aria-hidden="true">${x.emoji}</div>`:''}<div style="flex:1"><span class="pill">${esc(x.cat)}</span><p class="russian" lang="ru">${esc(x.ru)}</p><p class="translation">${esc(x.en)}</p>${inst?`<p class="tiny muted">${esc(x.desc)}</p>`:''}</div></div><div class="row" style="margin-top:12px">${speakButton(x.ru)}${saveButton(x.id)}</div>${statusButtons(x.id)}</div>`)}
function notebook(){let saved=vocab.filter(x=>state.saved.includes(x.id));return heading('My Notebook','Saved vocabulary and your private notes.')+`<h2>★ Saved vocabulary (${saved.length})</h2>`+groups(saved,x=>`<div class="card"><p class="russian" lang="ru">${esc(x.ru)}</p><p class="translation">${esc(x.en)}</p><div class="row">${speakButton(x.ru)}${saveButton(x.id)}</div>${statusButtons(x.id)}</div>`)+`<div class="section card"><h3>New personal note</h3><label for="note">Write a study note</label><textarea id="note" placeholder="e.g. Remember: Подайте = please pass..."></textarea><p>${button('+ Add note','addNote','action')}</p></div><h2>My notes</h2>${groups(state.notes.map((n,i)=>({...n,i})),n=>`<div class="card"><div class="row between"><span class="tiny muted">${esc(n.date)}</span>${button('Delete','deleteNote:'+n.i)}</div><p style="white-space:pre-wrap">${esc(n.text)}</p></div>`)}`}
function plan(){let undone=dialogues.find(x=>!state.done.includes(x.id))||dialogues[0];let reviews=vocab.filter(x=>['Review','Need practice'].includes(state.status[x.id]));return heading('My Study Plan','A simple plan for steady improvement.')+`<div class="card"><h3>How much time do you have today?</h3><div class="chips">${[10,20,30].map(n=>`<button class="chip ${studyMinutes===n?'active':''}" data-minutes="${n}">${n} minutes</button>`).join('')}</div><h3>Today’s suggestion</h3><div class="line"><b>1. Dialogue • ${Math.round(studyMinutes*.45)} min</b><p>${esc(undone.title)}</p>${button('Start dialogue','suggested')}</div><div class="line"><b>2. Vocabulary • ${Math.round(studyMinutes*.35)} min</b><p>Learn 5 items from Instruments or Expressions.</p>${button('Open vocabulary','vocab')}</div><div class="line"><b>3. Quick review • ${studyMinutes-Math.round(studyMinutes*.45)-Math.round(studyMinutes*.35)} min</b><p>${reviews.length} words currently need review.</p>${button('Take quiz','startQuiz')}</div></div><div class="card"><h3>Your progress</h3><p>✓ Completed dialogues: <b>${state.done.length}/${dialogues.length}</b></p><p>✓ Vocabulary mastered: <b>${vocab.filter(x=>state.status[x.id]==='Know it').length}/${vocab.length}</b></p><p>↺ Review items: <b>${reviews.length}</b></p><p>🧠 Quiz accuracy: <b>${state.quizAttempts?Math.round(state.quizCorrect/state.quizAttempts*100)+'%':'No quizzes yet'}</b></p></div><div class="card"><h3>Backup your progress</h3><p class="muted tiny">Progress is stored locally on this device. Export a backup before clearing browser data or changing devices.</p><div class="row">${button('↓ Export backup','export')}${button('↑ Import backup','import')}</div><input id="importFile" class="hide" type="file" accept="application/json,.json"></div>`}
function startQuiz(){let pool=vocab.filter(x=>state.status[x.id]==='Know it');if(pool.length<4)pool=vocab;const shuffled=[...pool].sort(()=>Math.random()-.5);quiz={items:shuffled.slice(0,Math.min(10,shuffled.length)),index:0,score:0};quizFeedback=null;page='quiz';render()}function quizPage(){if(!quiz)return heading('Practice Quiz','Russian to English • 10 quick questions')+`<div class="hero"><h2>Ready to practice?</h2><p>Choose the correct English meaning. Incorrect answers are automatically marked for review.</p>${button('Start quiz','startQuiz','action')}</div>`;if(quiz.index>=quiz.items.length)return heading('Quiz results','Great work — keep practising!')+`<div class="hero"><h1>${quiz.score} / ${quiz.items.length}</h1><p>Correct answers</p>${button('Try another quiz','startQuiz','action')}</div>`;let x=quiz.items[quiz.index],other=vocab.filter(v=>v.id!==x.id).sort(()=>Math.random()-.5).slice(0,3),choices=[x,...other].sort(()=>Math.random()-.5);if(!quiz.choices||quiz.choiceIndex!==quiz.index){quiz.choices=choices;quiz.choiceIndex=quiz.index}return heading('Practice Quiz',`Question ${quiz.index+1} of ${quiz.items.length} • Score ${quiz.score}`)+`<div class="card"><p class="muted">What does this mean?</p><p class="russian" lang="ru">${esc(x.ru)}</p>${speakButton(x.ru)}</div><div class="card">${quiz.choices.map(v=>`<button ${quizFeedback?'disabled':''} data-answer="${v.id}" class="quizbtn ${quizFeedback?(v.id===x.id?'correct':v.id===quizFeedback?'wrong':''):''}">${esc(v.en)}</button>`).join('')}${quizFeedback?`<div class="notice">${quizFeedback===x.id?'✓ Correct!':'Keep practising — this item is marked for review.'}</div>${button('Next →','nextQuestion','action')}`:''}</div>`}
function render(){document.getElementById('main').innerHTML=page==='home'?home():page==='dialogues'?detail?dialogueView():dialogueList():page==='instruments'||page==='expressions'?itemList(page):page==='notebook'?notebook():page==='plan'?plan():quizPage();let links=[['⌂','Home','home'],['💬','Dialogues','dialogues'],['🦷','Tools','instruments'],['🧠','Quiz','quiz'],['📓','Notes','notebook']];document.getElementById('nav').innerHTML=links.map(([ic,t,p])=>`<button class="${page===p?'active':''}" data-go="${p}"><b>${ic}</b>${t}</button>`).join('')}
function updateStatus(id,s){state.status[id]=state.status[id]===s?'New':s;save();render()}function downloadBackup(){let blob=new Blob([JSON.stringify({app:'My Dental Russian',version:1,created:new Date().toISOString(),state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-dental-russian-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
document.addEventListener('click',e=>{let el=e.target.closest('[data-go],[data-action],[data-dialogue],[data-cat],[data-filter],[data-id],[data-save],[data-speak],[data-minutes],[data-answer]');if(!el)return;if(el.dataset.go){go(el.dataset.go);return}if(el.dataset.dialogue){go('dialogues',el.dataset.dialogue);state.last=el.dataset.dialogue;save();return}if(el.dataset.cat){category=el.dataset.cat;render();return}if(el.dataset.filter){filter=el.dataset.filter;render();return}if(el.dataset.id){updateStatus(el.dataset.id,el.dataset.status);return}if(el.dataset.save){let id=el.dataset.save;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save();render();return}if(el.dataset.speak){speak(decodeURIComponent(el.dataset.speak));return}if(el.dataset.minutes){studyMinutes=Number(el.dataset.minutes);render();return}if(el.dataset.answer){if(quizFeedback)return;let id=el.dataset.answer,x=quiz.items[quiz.index];quizFeedback=id;state.quizAttempts++;if(id===x.id){quiz.score++;state.quizCorrect++}else state.status[x.id]='Review';save();render();return}let a=el.dataset.action;if(!a)return;if(a==='back'){if(page==='dialogues'&&detail){detail=null;render()}else go('home')}else if(a==='continue'){go('dialogues',state.last||dialogues[0].id)}else if(a==='complete'){let id=detail;state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];save();render()}else if(a==='startQuiz')startQuiz();else if(a==='nextQuestion'){quiz.index++;quizFeedback=null;render()}else if(a==='addNote'){let input=document.getElementById('note'),t=input?.value.trim();if(!t){toast('Write a note first.');return}state.notes.unshift({text:t,date:new Date().toLocaleDateString('en-GB')});save();render()}else if(a.startsWith('deleteNote:')){state.notes.splice(Number(a.split(':')[1]),1);save();render()}else if(a==='export')downloadBackup();else if(a==='import'){document.getElementById('importFile').click()}else if(a==='suggested')go('dialogues',(dialogues.find(x=>!state.done.includes(x.id))||dialogues[0]).id);else if(a==='vocab')go('instruments')});
document.addEventListener('change',async e=>{if(e.target?.id!=='importFile')return;try{let obj=JSON.parse(await e.target.files[0].text());if(obj.app!=='My Dental Russian'||!obj.state||typeof obj.state!=='object'||!Array.isArray(obj.state.saved)||!Array.isArray(obj.state.notes)||!Array.isArray(obj.state.done))throw Error('Not a valid backup');if(!confirm('Replace your current progress with this backup?'))return;state={...defaultState,...obj.state};save();render();toast('Backup imported.')}catch(err){toast('Could not import this backup.')}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
