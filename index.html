ass the implant driver.", "fa": "درایور ایمپلنت را بدهید.", "cat": "Implantology"}, {"id": "e142", "ru": "Проверьте настройки крутящего момента.", "en": "Check the torque settings.", "fa": "تنظیمات گشتاور را بررسی کنید.", "cat": "Implantology"}, {"id": "e143", "ru": "Подготовьте костный материал.", "en": "Prepare the bone graft material.", "fa": "مواد پیوند استخوان را آماده کنید.", "cat": "Implantology"}, {"id": "e144", "ru": "Подготовьте слепочную ложку.", "en": "Prepare the impression tray.", "fa": "تری قالب‌گیری را آماده کنید.", "cat": "Prosthodontics"}, {"id": "e145", "ru": "Замешайте альгинат по инструкции.", "en": "Mix the alginate according to instructions.", "fa": "آلژینات را طبق دستور مخلوط کنید.", "cat": "Prosthodontics"}, {"id": "e146", "ru": "Подготовьте ретракционную нить.", "en": "Prepare the retraction cord.", "fa": "نخ کنارزننده لثه را آماده کنید.", "cat": "Prosthodontics"}, {"id": "e147", "ru": "Проверьте прикус.", "en": "Check the bite.", "fa": "اکلوژن را بررسی کنید.", "cat": "Prosthodontics"}, {"id": "e148", "ru": "Нужен временный цемент.", "en": "We need temporary cement.", "fa": "سمان موقت لازم داریم.", "cat": "Prosthodontics"}, {"id": "e149", "ru": "Подготовьте временную коронку.", "en": "Prepare the temporary crown.", "fa": "روکش موقت را آماده کنید.", "cat": "Prosthodontics"}, {"id": "e150", "ru": "Подайте ортодонтические щипцы.", "en": "Pass the orthodontic pliers.", "fa": "پلایر ارتودنسی را بدهید.", "cat": "Orthodontics"}, {"id": "e151", "ru": "Нужна новая дуга.", "en": "A new archwire is needed.", "fa": "آرچ‌وایر جدید لازم است.", "cat": "Orthodontics"}, {"id": "e152", "ru": "Подготовьте лигатуры.", "en": "Prepare the ligatures.", "fa": "لیگاچورها را آماده کنید.", "cat": "Orthodontics"}, {"id": "e153", "ru": "Проверьте брекет.", "en": "Check the bracket.", "fa": "براکت را بررسی کنید.", "cat": "Orthodontics"}, {"id": "e154", "ru": "Подготовьте ультразвуковой скейлер.", "en": "Prepare the ultrasonic scaler.", "fa": "جرم‌گیر اولتراسونیک را آماده کنید.", "cat": "Periodontics"}, {"id": "e155", "ru": "Подайте кюрету Грейси.", "en": "Pass the Gracey curette.", "fa": "کورت گریسی را بدهید.", "cat": "Periodontics"}, {"id": "e156", "ru": "Измерьте глубину кармана.", "en": "Measure the pocket depth.", "fa": "عمق پاکت لثه را اندازه بگیرید.", "cat": "Periodontics"}, {"id": "e157", "ru": "Подготовьте датчик рентгена.", "en": "Prepare the X-ray sensor.", "fa": "سنسور رادیوگرافی را آماده کنید.", "cat": "Radiography"}, {"id": "e158", "ru": "Наденьте защитный чехол на датчик.", "en": "Put a protective sleeve on the sensor.", "fa": "کاور محافظ را روی سنسور بکشید.", "cat": "Radiography"}, {"id": "e159", "ru": "Расположите держатель датчика.", "en": "Position the sensor holder.", "fa": "نگهدارنده سنسور را قرار دهید.", "cat": "Radiography"}, {"id": "e160", "ru": "Пожалуйста, не двигайтесь во время снимка.", "en": "Please do not move during the X-ray.", "fa": "لطفاً هنگام عکس‌برداری تکان نخورید.", "cat": "Radiography"}, {"id": "e161", "ru": "Инструменты нужно продезинфицировать.", "en": "The instruments must be disinfected.", "fa": "ابزارها باید ضدعفونی شوند.", "cat": "Sterilization"}, {"id": "e162", "ru": "Проверьте целостность пакета.", "en": "Check the pouch integrity.", "fa": "سالم بودن پاکت را بررسی کنید.", "cat": "Sterilization"}, {"id": "e163", "ru": "Загрузите автоклав по инструкции.", "en": "Load the autoclave as instructed.", "fa": "اتوکلاو را طبق دستور بارگذاری کنید.", "cat": "Sterilization"}, {"id": "e164", "ru": "Запишите номер цикла.", "en": "Record the cycle number.", "fa": "شماره چرخه را ثبت کنید.", "cat": "Sterilization"}, {"id": "e165", "ru": "Стерильный набор готов.", "en": "The sterile kit is ready.", "fa": "ست استریل آماده است.", "cat": "Sterilization"}, {"id": "e166", "ru": "Добрый день! У вас запись?", "en": "Good afternoon! Do you have an appointment?", "fa": "روز بخیر! وقت قبلی دارید؟", "cat": "Reception"}, {"id": "e167", "ru": "На какое время вы записаны?", "en": "What time is your appointment?", "fa": "برای چه ساعتی وقت دارید؟", "cat": "Reception"}, {"id": "e168", "ru": "Подождите, пожалуйста, в зоне ожидания.", "en": "Please wait in the waiting area.", "fa": "لطفاً در سالن انتظار منتظر بمانید.", "cat": "Reception"}, {"id": "e169", "ru": "Врач пригласит вас через несколько минут.", "en": "The dentist will call you in a few minutes.", "fa": "دندانپزشک تا چند دقیقه دیگر صدایتان می‌کند.", "cat": "Reception"}, {"id": "e170", "ru": "Вам удобно в понедельник?", "en": "Would Monday work for you?", "fa": "دوشنبه برایتان مناسب است؟", "cat": "Reception"}, {"id": "e171", "ru": "Я работала в стоматологической клинике.", "en": "I have worked in a dental clinic.", "fa": "در کلینیک دندانپزشکی کار کرده‌ام.", "cat": "Job Interview"}, {"id": "e172", "ru": "Я умею ассистировать в четыре руки.", "en": "I can assist using four-handed dentistry.", "fa": "کار چهاردستی را بلدم.", "cat": "Job Interview"}, {"id": "e173", "ru": "Я знаю основные стоматологические инструменты.", "en": "I know the main dental instruments.", "fa": "ابزارهای اصلی دندانپزشکی را می‌شناسم.", "cat": "Job Interview"}, {"id": "e174", "ru": "Я могу работать по сменам.", "en": "I can work shifts.", "fa": "می‌توانم شیفتی کار کنم.", "cat": "Job Interview"}, {"id": "e175", "ru": "Я быстро учусь.", "en": "I learn quickly.", "fa": "سریع یاد می‌گیرم.", "cat": "Job Interview"}, {"id": "e176", "ru": "Где находится ближайшая аптека?", "en": "Where is the nearest pharmacy?", "fa": "نزدیک‌ترین داروخانه کجاست؟", "cat": "Everyday Russian"}, {"id": "e177", "ru": "Я немного говорю по-русски.", "en": "I speak a little Russian.", "fa": "من کمی روسی صحبت می‌کنم.", "cat": "Everyday Russian"}, {"id": "e178", "ru": "Повторите, пожалуйста, медленнее.", "en": "Please repeat more slowly.", "fa": "لطفاً آرام‌تر تکرار کنید.", "cat": "Everyday Russian"}, {"id": "e179", "ru": "Как это называется по-русски?", "en": "What is this called in Russian?", "fa": "این به روسی چه نام دارد؟", "cat": "Everyday Russian"}, {"id": "e180", "ru": "Я не совсем dialogues.push(...[{"id":"d25","title":"Confirming the appointment","cat":"Reception & Patient","desc":"Practical situation • Практический диалог","lines":[["Receptionist","На какое время вы записаны?","What time is your appointment?"],["Patient","На десять тридцать, на имя Иванова.","At ten thirty, under Ivanova."]]},{"id":"d26","title":"Finding the correct clinic","cat":"Reception & Patient","desc":"Practical situation • Практический диалог","lines":[["Patient","Это стоматология на втором этаже?","Is this the dental clinic on the second floor?"],["Receptionist","Да, поднимитесь по лестнице и поверните направо.","Yes, go upstairs and turn right."]]},{"id":"d27","title":"New patient registration","cat":"Reception & Patient","desc":"Practical situation • Практический диалог","lines":[["Receptionist","Вы у нас впервые?","Is this your first visit here?"],["Patient","Да, мне нужно заполнить анкету?","Yes, do I need to fill in a form?"]]},{"id":"d28","title":"Checking identification","cat":"Reception & Patient","desc":"Practical situation • Практический диалог","lines":[["Receptionist","Покажите, пожалуйста, документ.","Please show your ID, please."],["Patient","Конечно, вот мой паспорт.","Certainly, here is my passport."]]},{"id":"d29","title":"Rescheduling a visit","cat":"Reception & Patient","desc":"Practical situation • Практический диалог","lines":[["Patient","Можно перенести приём на пятницу?","Could I move the appointment to Friday?"],["Receptionist","Да, есть свободное время в пятницу утром.","Yes, there is an available time on Friday morning."]]},{"id":"d30","title":"Cancelling an appointment","cat":"Reception & Patient","desc":"Practical situation • Практический диалог","lines":[["Patient","Мне нужно отменить завтрашний приём.","I need to cancel tomorrow's appointment."],["Receptionist","Хорошо, я отмечу отмену в расписании.","Okay, I'll mark the cancellation in the schedule."]]},{"id":"d31","title":"Patient arrives late","cat":"Reception & Patient","desc":"Practical situation • Практический диалог","lines":[["Patient","Извините, я немного опоздал.","Sorry, I'm a little late."],["Receptionist","Ничего страшного, я уточню у врача.","No problem, I'll check with the dentist."]]},{"id":"d32","title":"Waiting area instructions","cat":"Reception & Patient","desc":"Practical situation • Практический диалог","lines":[["Receptionist","Пожалуйста, подождите в зоне ожидания.","Please wait in the waiting area."],["Patient","Хорошо, спасибо за информацию.","Okay, thank you for the information."]]},{"id":"d33","title":"Confirming phone number","cat":"Reception & Patient","desc":"Practical situation • Практический диалог","lines":[["Receptionist","Ваш номер телефона не изменился?","Has your phone number changed?"],["Patient","Нет, номер остался прежним.","No, it's the same number."]]},{"id":"d34","title":"Giving directions","cat":"Reception & Patient","desc":"Practical situation • Практический диалог","lines":[["Patient","Где находится рентген-кабинет?","Where is the X-ray room?"],["Receptionist","В конце коридора, слева.","At the end of the corridor, on the left."]]},{"id":"d35","title":"Putting on a dental bib","cat":"Assistant & Patient","desc":"Practical situation • Практический диалог","lines":[["Assistant","Я надену вам защитный нагрудник.","I'll put a protective bib on you."],["Patient","Хорошо, спасибо.","Okay, thank you."]]},{"id":"d36","title":"Positioning the chair","cat":"Assistant & Patient","desc":"Practical situation • Практический диалог","lines":[["Assistant","Сейчас я немного опущу кресло.","I'll lower the chair a little now."],["Patient","Хорошо, я готов.","Okay, I'm ready."]]},{"id":"d37","title":"Adjusting head position","cat":"Assistant & Patient","desc":"Practical situation • Практический диалог","lines":[["Assistant","Поверните голову немного вправо.","Turn your head slightly to the right."],["Patient","Так удобно?","Is this position okay?"]]},{"id":"d38","title":"Explaining suction","cat":"Assistant & Patient","desc":"Practical situation • Практический диалог","lines":[["Patient","Что это за трубка?","What is this tube for?"],["Assistant","Это слюноотсос, он удаляет слюну.","It's a saliva ejector; it removes saliva."]]},{"id":"d39","title":"Warning about water spray","cat":"Assistant & Patient","desc":"Practical situation • Практический диалог","lines":[["Assistant","Сейчас будет немного воды.","There will be a little water now."],["Patient","Понятно, спасибо.","Understood, thank you."]]},{"id":"d40","title":"Asking about discomfort","cat":"Assistant & Patient","desc":"Practical situation • Практический диалог","lines":[["Assistant","Вам удобно в таком положении?","Are you comfortable in this position?"],["Patient","Да, всё хорошо.","Yes, everything is fine."]]},{"id":"d41","title":"Offering a break","cat":"Assistant & Patient","desc":"Practical situation • Практический диалог","lines":[["Assistant","Хотите сделать небольшой перерыв?","Would you like a short break?"],["Patient","Да, пожалуйста, на минуту.","Yes, please, for a minute."]]},{"id":"d42","title":"Checking numbness","cat":"Assistant & Patient","desc":"Practical situation • Практический диалог","lines":[["Assistant","Чувствуете онемение губы?","Can you feel numbness in your lip?"],["Patient","Да, губа уже онемела.","Yes, my lip is numb now."]]},{"id":"d43","title":"Protective glasses","cat":"Assistant & Patient","desc":"Practical situation • Практический диалог","lines":[["Assistant","Наденьте, пожалуйста, защитные очки.","Please put on the protective glasses."],["Patient","Они должны оставаться до конца процедуры?","Should I keep them on until the procedure ends?"]]},{"id":"d44","title":"Patient needs to swallow","cat":"Assistant & Patient","desc":"Practical situation • Практический диалог","lines":[["Patient","Можно мне сглотнуть?","May I swallow?"],["Assistant","Да, конечно, мы сделаем паузу.","Yes, of course, we'll pause."]]},{"id":"d45","title":"Checking the dental light","cat":"Assistant & Dentist","desc":" dialogues.push(...[{"id":"d114","cat":"Emergency & Safety","title":"Patient feels faint","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Assistant","Вам нехорошо? Давайте остановимся.","Are you feeling unwell? Let's stop.","حال‌تان خوب نیست؟ بیایید متوقف شویم."],["Patient","У меня кружится голова.","I feel dizzy.","سرم گیج می‌رود."],["Assistant","Я сейчас позову врача.","I'll call the dentist now.","الان دندانپزشک را صدا می‌کنم."]]},{"id":"d115","cat":"Emergency & Safety","title":"Patient reports breathing difficulty","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Patient","Мне трудно дышать.","I'm having trouble breathing.","نفس کشیدن برایم سخت است."],["Assistant","Мы немедленно остановим процедуру.","We'll stop the procedure immediately.","فوراً درمان را متوقف می‌کنیم."],["Assistant","Я зову врача прямо сейчас.","I'm calling the dentist right now.","همین حالا دندانپزشک را صدا می‌کنم."]]},{"id":"d116","cat":"Emergency & Safety","title":"Allergic reaction concern","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Patient","У меня появилась сыпь.","I've developed a rash.","روی پوستم دانه زده است."],["Assistant","Сообщу врачу немедленно.","I'll tell the dentist immediately.","فوراً به دندانپزشک خبر می‌دهم."],["Assistant","Пожалуйста, оставайтесь на месте.","Please stay where you are.","لطفاً همین‌جا بمانید."]]},{"id":"d117","cat":"Emergency & Safety","title":"Sudden severe pain","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Patient","У меня резкая боль.","I have sharp pain.","درد شدیدی دارم."],["Assistant","Мы остановимся. Где именно болит?","We'll stop. Where exactly does it hurt?","توقف می‌کنیم. دقیقاً کجا درد دارد؟"],["Patient","Вот здесь, справа.","Right here, on the right.","همین‌جا، سمت راست."]]},{"id":"d118","cat":"Emergency & Safety","title":"Patient needs an interpreter","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Patient","Я не всё понимаю по-русски.","I don't understand everything in Russian.","همه چیز را به روسی نمی‌فهمم."],["Assistant","Вам нужен переводчик?","Do you need an interpreter?","مترجم نیاز دارید؟"],["Patient","Да, пожалуйста.","Yes, please.","بله، لطفاً."]]},{"id":"d119","cat":"Children's Dentistry","title":"Greeting a child","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Assistant","Привет! Как тебя зовут?","Hi! What's your name?","سلام! اسمت چیست؟"],["Child","Меня зовут Миша.","My name is Misha.","اسمم میشاست."],["Assistant","Очень приятно, Миша!","Nice to meet you, Misha!","خوشبختم، میشا!"]]},{"id":"d120","cat":"Children's Dentistry","title":"Explaining the chair","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Assistant","Смотри, кресло умеет подниматься.","Look, the chair can go up.","ببین، صندلی می‌تواند بالا برود."],["Child","А оно не страшное?","Isn't it scary?","ترسناک نیست؟"],["Assistant","Нет, мы всё делаем медленно.","No, we'll do everything slowly.","نه، همه‌چیز را آرام انجام می‌دهیم."]]},{"id":"d121","cat":"Children's Dentistry","title":"Parent stays in room","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Parent","Можно мне остаться рядом?","May I stay nearby?","می‌توانم کنارش بمانم؟"],["Assistant","Я уточню у врача.","I'll check with the dentist.","از دندانپزشک می‌پرسم."],["Parent","Спасибо, я подожду.","Thank you, I'll wait.","ممنون، منتظر می‌مانم."]]},{"id":"d122","cat":"Children's Dentistry","title":"Gentle opening request","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Assistant","Открой ротик, пожалуйста.","Open your mouth, please.","لطفاً دهانت را باز کن."],["Child","Вот так?","Like this?","این‌طوری؟"],["Assistant","Да, молодец!","Yes, well done!","بله، آفرین!"]]},{"id":"d123","cat":"Children's Dentistry","title":"Reward after appointment","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Assistant","Ты сегодня отлично справился!","You did great today!","امروز خیلی خوب بودی!"],["Child","Мы уже закончили?","Are we finished?","کارمان تمام شد؟"],["Assistant","Да, на сегодня всё.","Yes, that's all for today.","بله، برای امروز تمام شد."]]},{"id":"d124","cat":"Chairside Workflow","title":"Setting chair position","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Поднимите спинку кресла.","Raise the chair backrest.","پشتی صندلی را بالا ببرید."],["Assistant","Так достаточно?","Is that high enough?","این‌قدر کافی است؟"],["Dentist","Да, спасибо.","Yes, thank you.","بله، ممنون."]]},{"id":"d125","cat":"Chairside Workflow","title":"Handling instrument transfer","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Передайте инструмент в правую руку.","Pass the instrument to my right hand.","ابزار را به دست راستم بدهید."],["Assistant","Передаю аккуратно.","I'm passing it carefully.","با دقت تحویل می‌دهم."],["Dentist","Благодарю.","Thank you.","متشکرم."]]},{"id":"d126","cat":"Chairside Workflow","title":"Working with water spray","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Включите подачу воды.","Turn on the water supply.","آب را وصل کنید."],["Assistant","Вода включена.","The water is on.","آب وصل است."],["Dentist","Теперь уменьшите поток.","Now reduce the flow.","حالا جریان را کمتر کنید."]]},{"id":"d127","cat":"Chairside Workflow","title":"Replacing contaminated gloves","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Assistant","Я сменю перчатки.","I'll change my gloves.","دستکش‌هایم را عوض می‌کنم."],["Dentist","Возьмите новую пару.","Take a new pair.","یک جفت جدید بردارید."],["Assistant","Готово, продолжаем.","Done, let's continue.","انجام شد، ادامه می‌دهیم."]]},{"id":"d128","cat":"Chairside Workflow","title":"Checking material expiry","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Проверьте срок годности материала.","Check the material's expiry date.","تاریخ انقضای ماده را بررسی کنید."],["Assistant","Срок годности не истёк.","It hasn't expired.","تاریخ انقضایش نگذشته است."],["Dentist","Хорошо, подготовьте его.","Good, prepare it.","خوب است، آماده‌اش کنید."]]},{"id":"d129","cat":"Periodontics","title":"Preparing periodontal chart","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Откройте пародонтальную карту.","Open the periodontal chart.","چارت پریودنتال را باز کنید."],["Assistant","Карта открыта.","The chart is open.","چارت باز است."],["Dentist","Записывайте показатели.","Record the measurements.","اندازه‌گیری‌ها را ثبت کنید."]]},{"id":"d130","cat":"Periodontics","title":"Requesting a probe","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Подайте пародонтологический зонд.","Pass the periodontal probe.","پروب پریودنتال را بدهید."],["Assistant","Вот зонд.","Here is the probe.","این هم پروب."],["Dentist","Спасибо, начинаем осмотр.","Thank you, let's start examining.","ممنون، معاینه را شروع می‌کنیم."]]},{"id":"d131","cat":"Periodontics","title":"Explaining gum bleeding","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Patient","Почему дёсны кровоточат?","Why are my gums bleeding?","چرا لثه‌هایم خونریزی می‌کنند؟"],["Assistant","Врач объяснит причину после осмотра.","The dentist will explain after the examination.","دندانپزشک پس از معاینه علت را توضیح می‌دهد."],["Patient","Хорошо.","Okay.","باشه."]]},{"id":"d132","cat":"Periodontics","title":"Ultrasonic scaler setup","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Подготовьте ультразвуковой скейлер.","Prepare the ultrasonic scaler.","دستگاه جرم‌گیر اولتراسونیک را آماده کنید."],["Assistant","Насадка установлена.","The tip is attached.","سری دستگاه وصل شده است."],["Dentist","Проверьте подачу воды.","Check the water supply.","آب دستگاه را بررسی کنید."]]},{"id":"d133","cat":"Orthodontics","title":"Preparing bracket kit","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Откройте набор брекетов.","Open the bracket kit.","ست براکت را باز کنید."],["Assistant","Какой зуб будем фиксировать?","Which tooth are we bonding?","برای کدام دندان نصب می‌کنیم؟"],["Dentist","Верхний правый клык.","The upper right canine.","نیش بالای سمت راست."]]},{"id":"d134","cat":"Orthodontics","title":"Changing elastic ligatures","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Подайте эластические лигатуры.","Pass the elastic ligatures.","لیگاچورهای الاستیک را بدهید."],["Assistant","Какой цвет нужен?","Which color do you need?","چه رنگی لازم دارید؟"],["Dentist","Прозрачные, пожалуйста.","Clear ones, please.","شفاف، لطفاً."]]},{"id":"d135","cat":"Orthodontics","title":"Retainer instruction","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Patient","Когда надевать ретейнер?","When should I wear the retainer?","چه زمانی ریتینر را بگذارم؟"],["Assistant","Врач даст вам точный график.","The orthodontist will give you the exact schedule.","متخصص ارتودنسی برنامه دقیق را می‌دهد."],["Patient","Я запишу рекомендации.","I'll write down the advice.","توصیه‌ها را یادداشت می‌کنم."]]},{"id":"d136","cat":"Orthodontics","title":"Wire discomfort","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Patient","Дуга царапает щёку.","The wire is scratching my cheek.","سیم گونه‌ام را خراش می‌دهد."],["Assistant","Я сообщу врачу.","I'll tell the orthodontist.","به متخصص ارتودنسی می‌گویم."],["Patient","Спасибо, очень неприятно.","Thanks, it's very uncomfortable.","ممنون، خیلی ناراحت‌کننده است."]]},{"id":"d137","cat":"Prosthodontics","title":"Choosing impression tray","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Нужна ложка для верхней челюсти.","We need an upper impression tray.","تری قالب‌گیری فک بالا لازم است."],["Assistant","Какой размер выбрать?","Which size should I choose?","چه سایزی انتخاب کنم؟"],["Dentist","Попробуйте средний.","Try medium.","متوسط را امتحان کنید."]]},{"id":"d138","cat":"Prosthodontics","title":"Mixing impression material","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Подготовьте слепочный материал.","Prepare the impression material.","ماده قالب‌گیری را آماده کنید."],["Assistant","Проверю инструкцию производителя.","I'll check the manufacturer's instructions.","دستورالعمل سازنده را بررسی می‌کنم."],["Dentist","Хорошо, соблюдайте рабочее время.","Good, follow the working time.","خوب است، زمان کار را رعایت کنید."]]},{"id":"d139","cat":"Prosthodontics","title":"Temporary crown check","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Patient","Временная коронка шатается.","My temporary crown feels loose.","روکش موقتم لق شده است."],["Assistant","Я сообщу врачу перед приёмом.","I'll inform the dentist before the appointment.","قبل از ویزیت به دندانپزشک خبر می‌دهم."],["Patient","Спасибо.","Thank you.","ممنون."]]},{"id":"d140","cat":"Prosthodontics","title":"Shade selection","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Принесите шкалу оттенков.","Bring the shade guide.","راهنمای رنگ را بیاورید."],["Assistant","Вот шкала оттенков.","Here's the shade guide.","این هم راهنمای رنگ."],["Dentist","Сравним при хорошем освещении.","Let's compare in good lighting.","در نور مناسب مقایسه کنیم."]]},{"id":"d141","cat":"Implantology","title":"Opening sterile implant pack","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Проверьте упаковку имплантата.","Check the implant package.","بسته‌بندی ایمپلنت را بررسی کنید."],["Assistant","Упаковка целая, срок годности в порядке.","The package is intact and in date.","بسته سالم و تاریخ معتبر است."],["Dentist","Откройте по стерильному протоколу.","Open it following sterile protocol.","طبق پروتکل استریل بازش کنید."]]},{"id":"d142","cat":"Implantology","title":"Confirming implant size","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Сверьте размер имплантата с планом.","Check the implant size against the plan.","اندازه ایمپلنت را با طرح درمان تطبیق دهید."],["Assistant","Сейчас сверю маркировку.","I'll check the label now.","الان برچسب را تطبیق می‌دهم."],["Dentist","Назовите размер вслух.","Read the size aloud.","اندازه را با صدای بلند بگویید."]]},{"id":"d143","cat":"Implantology","title":"Preparing sterile irrigation","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Проверьте стерильный раствор.","Check the sterile irrigant.","محلول شست‌وشوی استریل را بررسی کنید."],["Assistant","Раствор готов.","The solution is ready.","محلول آماده است."],["Dentist","Следите за подачей.","Monitor the flow.","جریان را زیر نظر داشته باشید."]]},{"id":"d144","cat":"Implantology","title":"Recording implant batch","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Запишите номер партии имплантата.","Record the implant batch number.","شماره بچ ایمپلنت را ثبت کنید."],["Assistant","Запишу в карту пациента.","I'll record it in the patient's chart.","در پرونده بیمار ثبت می‌کنم."],["Dentist","Спасибо.","Thank you.","ممنون."]]},{"id":"d145","cat":"Radiography","title":"Preparing protective equipment","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Assistant","Наденьте защитный фартук, пожалуйста.","Please put on the protective apron.","لطفاً پیش‌بند محافظ را بپوشید."],["Patient","Хорошо.","Okay.","باشه."],["Assistant","Сейчас установим датчик.","We'll position the sensor now.","الان سنسور را قرار می‌دهیم."]]},{"id":"d146","cat":"Radiography","title":"Sensor discomfort","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Patient","Датчик давит на язык.","The sensor presses against my tongue.","سنسور به زبانم فشار می‌آورد."],["Assistant","Я сообщу врачу, чтобы поправить положение.","I'll tell the dentist so we can adjust it.","به دندانپزشک می‌گویم تا جایش را تنظیم کنیم."],["Patient","Спасибо.","Thank you.","ممنون."]]},{"id":"d147","cat":"Radiography","title":"Checking image quality","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Снимок получился чётким?","Is the image clear?",""],["Assistant","Сейчас проверю на экране.","I'll check the screen now.","الان روی نمایشگر بررسی می‌کنم."],["Dentist","Сообщите, если нужно повторить.","Tell me if a repeat is needed.","اگر تکرار لازم بود بگویید."]]},{"id":"d148","cat":"Radiography","title":"Sharing image with dentist","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Dentist","Откройте снимок на мониторе.","Open the image on the monitor.","عکس را روی مانیتور باز کنید."],["Assistant","Изображение открыто.","The image is open.","تصویر باز شد."],["Dentist","Увеличьте область шестого зуба.","Zoom in on the first molar area.","ناحیه دندان آسیای اول را بزرگ کنید."]]},{"id":"d149","cat":"Sterilization","title":"Sorting reusable instruments","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Colleague","Эти инструменты многоразовые?","Are these reusable instruments?",""],["Assistant","Да, их нужно обработать по инструкции.","Yes, they require processing per instructions.","بله، باید طبق دستورالعمل پردازش شوند."],["Colleague","Положу их в обозначенную зону.","I'll place them in the designated area.","در قسمت مشخص‌شده می‌گذارم."]]},{"id":"d150","cat":"Sterilization","title":"Checking sterilization indicators","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Colleague","Индикатор цикла изменил цвет?","Did the cycle indicator change color?",""],["Assistant","Проверю и зафиксирую результат.","I'll check and document the result.","بررسی و ثبت می‌کنم."],["Colleague","Хорошо.","Good.","خوب است."]]},{"id":"d151","cat":"Sterilization","title":"Damaged sterile pouch","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Assistant","У этой упаковки повреждён шов.","This pouch has a damaged seal.",""],["Colleague","Её нельзя использовать как стерильную.","It can't be used as sterile.","نمی‌توان آن را استریل در نظر گرفت."],["Assistant","Отложу на повторную обработку.","I'll set it aside for reprocessing.","برای پردازش دوباره کنار می‌گذارم."]]},{"id":"d152","cat":"Sterilization","title":"Instrument traceability","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Colleague","Где журнал стерилизации?","Where is the sterilization log?",""],["Assistant","На рабочем компьютере.","On the work computer.","روی کامپیوتر بخش."],["Colleague","Проверь номер цикла.","Check the cycle number.","شماره سیکل را بررسی کن."]]},{"id":"d153","cat":"Job Interview","title":"Introducing experience","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Interviewer","Расскажите о вашем опыте работы.","Tell me about your work experience.","از سابقه کارتان بگویید."],["Applicant","Я ассистировала врачу на терапевтическом приёме.","I assisted a dentist during restorative appointments.","در درمان‌های ترمیمی به دندانپزشک کمک کرده‌ام."],["Interviewer","С какими материалами вы работали?","What materials have you worked with?","با چه موادی کار کرده‌اید؟"]]},{"id":"d154","cat":"Job Interview","title":"Asking about schedule","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Applicant","Какой график работы в клинике?","What is the clinic's work schedule?","برنامه کاری کلینیک چطور است؟"],["Interviewer","График обсуждается на собеседовании.","We discuss the schedule during the interview.","برنامه در مصاحبه بررسی می‌شود."],["Applicant","Спасибо за информацию.","Thank you for the information.","ممنون از اطلاعات."]]},{"id":"d155","cat":"Job Interview","title":"Discussing sterilization","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Interviewer","Вы знаете этапы обработки инструментов?","Do you know the stages of instrument reprocessing?","مراحل آماده‌سازی مجدد ابزار را می‌دانید؟"],["Applicant","Да, я соблюдаю протокол клиники.","Yes, I follow the clinic's protocol.","بله، پروتکل کلینیک را رعایت می‌کنم."],["Interviewer","Хорошо, приведите пример.","Good, give an example.","خوب است، مثال بزنید."]]},{"id":"d156","cat":"University & Study","title":"Asking about a seminar","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Student","Во сколько начинается семинар?","What time does the seminar start?","سمینار چه ساعتی شروع می‌شود؟"],["Classmate","В девять утра.","At nine in the morning.","ساعت نه صبح."],["Student","Спасибо, буду вовремя.","Thanks, I'll be on time.","ممنون، به‌موقع می‌رسم."]]},{"id":"d157","cat":"University & Study","title":"Asking about lab instruments","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Student","Где взять набор инструментов?","Where can I get the instrument kit?","ست ابزار را از کجا بگیرم؟"],["Instructor","Получите его в учебной лаборатории.","Collect it from the teaching lab.","از آزمایشگاه آموزشی تحویل بگیرید."],["Student","Поняла, спасибо.","Understood, thank you.","متوجه شدم، ممنون."]]},{"id":"d158","cat":"University & Study","title":"Requesting an explanation","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Student","Не могли бы вы повторить, пожалуйста?","Could you repeat that, please?","ممکن است لطفاً تکرار کنید؟"],["Professor","Конечно, повторю медленнее.","Of course, I'll repeat more slowly.","البته، آهسته‌تر تکرار می‌کنم."],["Student","Большое спасибо.","Thank you very much.","خیلی ممنون."]]},{"id":"d159","cat":"Everyday Russian","title":"Finding a pharmacy","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Student","Подскажите, где ближайшая аптека?","Could you tell me where the nearest pharmacy is?","نزدیک‌ترین داروخانه کجاست؟"],["Passerby","Через дорогу, рядом с остановкой.","Across the road near the bus stop.","آن طرف خیابان، کنار ایستگاه."],["Student","Спасибо за помощь.","Thanks for your help.","ممنون از کمکتان."]]},{"id":"d160","cat":"Everyday Russian","title":"Checking metro direction","desc":"Three-turn clinical Russian practice • EN / FA","lines":[["Student","Эта линия идёт до центра?","Does this line go to the center?",""],["Passenger","Да, но нужно пересесть.","Yes, but you need to tr ","The dentist will explain the procedure and answer your questions.","دندانپزشک روش درمان را توضیح می‌دهد و به سؤال‌هایتان پاسخ می‌دهد."],["Patient","Можно уточнить, сколько времени это займёт?","May I ask how long it will take?","می‌توانم بپرسم چقدر طول می‌کشد؟"],["Assistant","Пожалуйста, уточните это у врача до начала лечения.","Please confirm that with the dentist before treatment starts.","لطفاً پیش از شروع درمان از دندانپزشک بپرسید."]]},{"id":"advanced-d5","title":"Four handed transfer","cat":"Chairside","desc":"Passing instruments safely","lines":[["Dentist","Передайте, пожалуйста, гладилку рабочим концом ко мне.","Please pass the plastic instrument with the working end toward me.","لطفاً ابزار فرم‌دهی را با سر کاری به سمت من بدهید."],["Assistant","Передаю. Острый инструмент держу за ручку.","Passing it. I am holding the sharp instrument by the handle.","می‌دهم. ابزار تیز را از دسته گرفته‌ام."],["Dentist","Уберите использованный инструмент из зоны передачи.","Remove the used instrument from the transfer zone.","ابزار استفاده‌شده را از ناحیه انتقال بردارید."]]},{"id":"advanced-d6","title":"Rubber dam selection","cat":"Endodontics","desc":"Isolation before treatment","lines":[["Dentist","Нужен коффердам и кламп для нижнего моляра.","I need a rubber dam and a clamp for a lower molar.","رابردم و کلمپ برای مولر پایین لازم دارم."],["Assistant","Подготовить рамку, платок и щипцы?","Should I prepare the frame, sheet and forceps?","فریم، ورق و فورسپس را آماده کنم؟"],["Dentist","Да, и проверьте устойчивость клампа.","Yes, and check the clamp stability.","بله، پایداری کلمپ را هم بررسی کنید."]]},{"id":"advanced-d7","title":"Working length measurement","cat":"Endodontics","desc":"Apex locator and files","lines":[["Dentist","Подключите апекслокатор.","Connect the apex locator.","اپکس لوکیتور را وصل کنید."],["Assistant","Апекслокатор подключён. Какой файл подать?","The apex locator is connected. Which file should I pass?","اپکس لوکیتور وصل شد. کدام فایل را بدهم؟"],["Dentist","К-файл десятого размера, пожалуйста.","A size 10 K-file, please.","لطفاً کی‌فایل سایز ده."]]},{"id":"advanced-d8","title":"Irrigation during endo","cat":"Endodontics","desc":"Safe chairside assistance","lines":[["Dentist","Подготовьте раствор для ирригации по протоколу.","Prepare the irrigation solution according to the protocol.","محلول شست‌وشو را طبق پروتکل آماده کنید."],["Assistant","Проверю название и концентрацию на этикетке.","I will check the name and concentration on the label.","نام و غلظت را روی برچسب بررسی می‌کنم."],["Dentist","Не подавайте шприц без подтверждения.","Do not pass the syringe without confirmation.","بدون تأیید سرنگ را ندهید."]]},{"id":"advanced-d9","title":"Composite shade check","cat":"Restorative Dentistry","desc":"Before composite placement","lines":[["Dentist","Проверьте оттенок композита до изоляции.","Check the composite shade before isolation.","رنگ کامپوزیت را پیش از ایزولاسیون بررسی کنید."],["Assistant","По шкале оттенков подходит A2. Подтвердите, пожалуйста.","Shade A2 seems suitable on the shade guide. Please confirm.","بر اساس راهنمای رنگ، A2 مناسب به نظر می‌رسد. لطفاً تأیید کنید."],["Dentist","Да, подготовьте этот оттенок.","Yes, prepare that shade.","بله، همان رنگ را آماده کنید."]]},{"id":"advanced-d10","title":"Matrix and wedge","cat":"Restorative Dentistry","desc":"Class II restoration","lines":[["Dentist","Нужны матрица и деревянный клин.","I need a matrix and a wooden wedge.","ماتریکس و وج چوبی لازم دارم."],["Assistant","Матрица установлена, клин готов.","The matrix is in place and the wedge is ready.","ماتریکس جاگذاری شده و وج آماده است."],["Dentist","Проверьте контактный пункт после реставрации.","Check the contact point after the restoration.","پس از ترمیم، نقطه تماس را بررسی کنید."]]},{"id":"advanced-d11","title":"Impression tray setup","cat":"Prosthodontics","desc":"Impression preparation","lines":[["Dentist","Подберите ложку подходящего размера.","Select an appropriately sized impression tray.","تری قالب‌گیری با اندازه مناسب انتخاب کنید."],["Assistant","Эта ложка подходит для верхней челюсти?","Does this tray fit the upper arch?","این تری برای فک بالا مناسب است؟"],["Dentist","Проверьте посадку до замешивания материала.","Check the fit before mixing the material.","قبل از مخلوط کردن ماده، اندازه را بررسی کنید."]]},{"id":"advanced-d12","title":"Temporary crown instructions","cat":"Prosthodontics","desc":"After temporary placement","lines":[["Assistant","Врач установил временную коронку.","The dentist has placed a temporary crown.","دندانپزشک روکش موقت را قرار داده است."],["Patient","Можно жевать на этой стороне?","Can I chew on this side?","می‌توانم با این سمت غذا بجوم؟"],["Assistant","Следуйте ограничениям, которые объяснил врач.","Follow the restrictions explained by the dentist.","محدودیت‌هایی را که دندانپزشک توضیح داده رعایت کنید."]]},{"id":"advanced-d13","title":"Surgical suction","cat":"Oral Surgery","desc":"Chairside roles","lines":[["Dentist","Держите аспиратор так, чтобы не закрывать обзор.","Hold the suction so that it does not block visibility.","ساکشن را طوری نگه دارید که دید را مسدود نکند."],["Assistant","Положение подходит?","Is this position suitable?","این موقعیت مناسب است؟"],["Dentist","Да, не касайтесь стерильной зоны нестерильной частью.","Yes. Do not touch the sterile area with the nonsterile part.","بله. بخش غیراستریل نباید به ناحیه استریل بخورد."]]},{"id":"advanced-d14","title":"Suture instrument count","cat":"Oral Surgery","desc":"Checking the surgical set","lines":[["Dentist","Проверьте иглодержатель и ножницы.","Check the needle holder and scissors.","نگهدارنده سوزن و قیچی را بررسی کنید."],["Assistant","Оба инструмента на месте.","Both instruments are in place.","هر دو ابزار سر جای خودشان هستند."],["Dentist","После процедуры сверим инструменты и расходные материалы.","After the procedure we will reconcile instruments and consumables.","پس از کار ابزارها و مواد مصرفی را شمارش می‌کنیم."]]},{"id":"advanced-d15","title":"Implant kit verification","cat":"Implantology","desc":"Kit and sterility","lines":[["Dentist","Проверьте набор для имплантации по плану операции.","Check the implant kit against the surgical plan.","ست ایمپلنت را با طرح جراحی بررسی کنید."],["Assistant","Маркировка и стерильность упаковки проверены.","The labeling and package sterility have been checked.","برچسب و استریل بودن بسته بررسی شده‌اند."],["Dentist","Хорошо. Откройте упаковку по моей команде.","Good. Open the package when I instruct you to.","خوب است. بسته را با دستور من باز کنید."]]},{"id":"advanced-d16","title":"Implant motor handoff","cat":"Implantology","desc":"Motor preparation","lines":[["Dentist","Проверьте подключение физиодиспенсера.","Check the connection of the implant motor.","اتصال موتور ایمپلنت را بررسی کنید."],["Assistant","Кабель и ирригация подключены.","The cable and irrigation are connected.","کابل و شست‌وشو متصل هستند."],["Dentist","Параметры выставим по хирургическому протоколу.","We will set the parameters according to the surgical protocol.","پارامترها را مطابق پروتکل جراحی تنظیم می‌کنیم."]]},{"id":"advanced-d17","title":"Orthodontic wire change","cat":"Orthodontics","desc":"Instrument preparation","lines":[["Dentist","Подготовьте лигатурные кусачки и новый провод.","Prepare ligature cutters and a new archwire.","کاتر لیگاچور و آرچ‌وایر جدید آماده کنید."],["Assistant","Какой размер дуги нужен?","What archwire size is needed?","چه سایزی از آرچ‌وایر لازم است؟"],["Dentist","Я уточню размер перед установкой.","I will confirm the size before placement.","اندازه را پیش از جاگذاری تأیید می‌کنم."]]},{"id":"advanced-d18","title":"Periodontal charting","cat":"Periodontics","desc":"Recording measurements","lines":[["Dentist","Записывайте глубину зондирования по участкам.","Record the probing depths by site.","عمق پروبینگ را برای هر ناحیه ثبت کنید."],["Assistant","Повторите, пожалуйста, последнее значение.","Please repeat the last value.","لطفاً عدد آخر را تکرار کنید."],["Dentist","Три миллиметра.","Three millimeters.","سه میلی‌متر."]]},{"id":"advanced-d19","title":"Panoramic imaging","cat":"Radiography","desc":"Patient positioning","lines":[["Assistant","Снимите, пожалуйста, металлические украшения с головы и шеи.","Please remove metal jewelry from your head and neck.","لطفاً زیورآلات فلزی سر و گردن را درآورید."],["Patient","Очки тоже снять?","Should I remove my glasses too?","عینک را هم بردارم؟"],["Assistant","Да, пожалуйста. Сейчас объясню, как встать.","Yes, please. I will explain how to stand.","بله لطفاً. حالا نحوه ایستادن را توضیح می‌دهم."]]},{"id":"advanced-d20","title":"Sharps disposal","cat":"Sterilization","desc":"Needle handling","lines":[["Colleague","Куда выбросить использованную иглу?","Where should I dispose of the used needle?","سوزن استفاده‌شده را کجا دور بریزم؟"],["Assistant","В контейнер для острых отходов.","In the sharps container.","در ظرف مخصوص پسماند تیز."],["Colleague","Не закрывать колпачком вручную, верно?","Do not recap it by hand, right?","نباید با دست دوباره درپوش بگذاریم، درست است؟"],["Assistant","Да, следуем протоколу клиники.","Correct. We follow the clinic protocol.","درست است. طبق پروتکل کلینیک عمل می‌کنیم."]]},{"id":"advanced-d21","title":"Emergency alert","cat":"Emergencies","desc":"Escalation within scope","lines":[["Patient","Мне нехорошо, кружится голова.","I feel unwell and dizzy.","حالم خوب نیست، سرم گیج می‌رود."],["Assistant","Я сейчас позову врача. Пожалуйста, оставайтесь на месте.","I will call the dentist now. Please stay where you are.","الان دندانپزشک را صدا می‌کنم. لطفاً همان‌جا بمانید."],["Assistant","Доктор, пациенту стало плохо.","Doctor, the patient is feeling unwell.","دکتر، حال بیمار بد شده است."]]},{"id":"advanced-d22","title":"Telephone appointment change","cat":"Reception","desc":"Rescheduling","lines":[["Receptionist","Здравствуйте, стоматологическая клиника, слушаю вас.","Hello, dental clinic speaking.","سلام، کلینیک دندانپزشکی، بفرمایید."],["Patient","Мне нужно перенести запись на другую дату.","I need to reschedule my appointment.","باید نوبتم را به تاریخ دیگری منتقل کنم."],["Receptionist","Назовите, пожалуйста, вашу фамилию и время записи.","Please tell me your surname and appointment time.","لطفاً نام خانوادگی و زمان نوبت را بگویید."]]},{"id":"advanced-d23","title":"Dental assistant interview II","cat":"Job Interview","desc":"Practical responsibilities","lines":[["Interviewer","Как вы готовите кабинет к приёму?","How do you prepare the treatment room for an appointment?","اتاق درمان را برای پذیرش بیمار چگونه آماده می‌کنید؟"],["Candidate","Я проверяю оборудование, расходные материалы и стерильные наборы.","I check equipment, consumables and sterile sets.","تجهیزات، مواد مصرفی و ست‌های استریل را بررسی می‌کنم."],["Interviewer","Вы умеете вести учёт инструментов?","Can you keep instrument records?","می‌توانید موجودی ابزارها را ثبت کنید؟"],["Candidate","Да, по инструкции клиники.","Yes, according to clinic instructions.","بله، مطابق دستورالعمل کلینیک."]]},{"id":"advanced-d24","title":"Pediatric appointment","cat":"Pediatric Dentistry","desc":"Comforting a child","lines":[["Assistant","Привет! Хочешь сначала посмотреть на кресло?","Hi! Would you like to see the chair first?","سلام! دوست داری اول صندلی را ببینی؟"],["Child","Оно двигается?","Does it move?","حرکت می‌کند؟"],["Assistant","Да, оно поднимается и опускается.","Yes, it goes up and down.","بله، بالا و پایین می‌رود."],["Assistant","Если тебе неудобно, скажи нам.","If you feel uncomfortable, tell us.","اگر راحت نیستی به ما بگو."]]},{"id":"advanced-d25","title":"Late patient policy","cat":"Reception","desc":"Arrival and waiting","lines":[["Patient","Извините, я опоздал на приём.","Sorry, I am late for my appointment.","ببخشید، برای نوبتم دیر رسیدم."],["Receptionist","Я уточню у врача, сможет ли он вас принять.","I will check with the dentist whether they can see you.","از دندانپزشک می‌پرسم آیا می‌تواند شما را بپذیرد."],["Patient","Спасибо, я подожду.","Thank you, I will wait.","ممنون، منتظر می‌مانم."]]},{"id":"advanced-d26","title":"Hand hygiene before gloves","cat":"Sterilization","desc":"Infection prevention","lines":[["Colleague","Можно надеть новые перчатки без обработки рук?","Can I put on new gloves without hand hygiene?","می‌توانم بدون بهداشت دست دستکش نو بپوشم؟"],["Assistant","Нет, обработка рук обязательна по протоколу.","No, hand hygiene is required by protocol.","نه، بهداشت دست طبق پروتکل الزامی است."],["Colleague","Понял, спасибо.","Understood, thank you.","متوجه شدم، ممنون."]]}]);

const vocab=[...instruments,...expressions];const statuses=['New','Know it','Review','Need practice'];const key='myDentalRussian_v1';const defaultState={status:{},saved:[],notes:[],done:[],last:null,quizAttempts:0,quizCorrect:0};let state;try{state={...defaultState,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{state={...defaultState}};let quizCategory='All';let page='home',detail=null,category='All',filter='All',quiz=null,quizFeedback=null,studyMinutes=20,quizScope='All',quizLanguage='English';
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{toast('Storage unavailable. Use Export backup.')}}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(msg){let t=document.createElement('div');t.textContent=msg;t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#e0c1ff;color:#241633;border-radius:12px;padding:12px 17px;z-index:99;max-width:90%;box-shadow:0 8px 30px #0007';document.body.append(t);setTimeout(()=>t.remove(),2300)}function speak(text){if(!('speechSynthesis'in window)){toast('Speech playback is not available in this browser.');return}speechSynthesis.cancel();let utterance=new SpeechSynthesisUtterance(text);utterance.lang='ru-RU';utterance.rate=.83;const voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase()==='ru-ru')||voices.find(v=>v.lang.toLowerCase().startsWith('ru'));if(v)utterance.voice=v;speechSynthesis.speak(utterance)}function pct(){let marked=vocab.filter(x=>state.status[x.id]==='Know it').length;return Math.round(marked/vocab.length*100)}function button(text,action,cls='secondary'){return `<button class="${cls}" data-action="${action}">${text}</button>`}function go(p,id){page=p;detail=id||null;category='All';filter='All';render();scrollTo({top:0,behavior:'instant'})}function heading(title,sub){return `<div class="topbar">${button('← Back','back','back')}<h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}</div>`}function statusButtons(id){return `<div class="status">${statuses.slice(1).map(s=>`<button data-status="${esc(s)}" data-id="${id}" class="${state.status[id]===s?'chosen':''}">${esc(s)}</button>`).join('')}</div>`}function saveButton(id){return `<button class="secondary" data-save="${id}">${state.saved.includes(id)?'★ Saved':'☆ Save'}</button>`}function speakButton(t){return `<button class="secondary" data-speak="${encodeURIComponent(t)}" aria-label="Play Russian pronunciation">▶ Listen</button>`}function groups(items,fn){return items.map(fn).join('')||'<div class="empty">No items match this filter yet.</div>'}function filters(cats,current,prop){return `<div class="chips">${cats.map(c=>`<button class="chip ${current===c?'active':''}" data-${prop}="${esc(c)}">${esc(c)}</button>`).join('')}</div>`}
function home(){return `<div class="hero"><p class="tiny">YOUR PERSONAL STUDY SPACE</p><h1>Добро пожаловать! 👋</h1><p>Russian-English clinical communication with curated Persian translations, specialist instruments and real practice.</p><div class="progress"><span style="width:${pct()}%"></span></div><div class="row between"><span class="tiny">${pct()}% vocabulary mastered</span><span class="pill">${state.done.length}/${dialogues.length} dialogues completed</span></div></div><div class="grid">${[['💬','Dialogues','Clinical conversations','dialogues'],['🦷','Instruments','Tools & materials','instruments'],['📖','Expressions','Useful Russian phrases','expressions'],['🧠','Quiz','Test your knowledge','quiz'],['📓','My Notebook','Saved words & notes','notebook'],['🗓️','Study Plan','Your daily routine','plan']].map(x=>`<button class="tile" data-go="${x[3]}"><span class="ico">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div><div class="section card"><h3>▶ Continue learning</h3><p class="muted">${state.last?esc(dialogues.find(d=>d.id===state.last)?.title||'Lesson'):'Start with a practical conversation at the clinic.'}</p>${button('Open lesson','continue','action')}</div>`}
function dialogueList(){if(!detail)return categoryLanding('dialogues');let matched=dialogues.filter(d=>category==='All'||d.cat===category);return heading(esc(category),`${matched.length} conversations • Practical Russian`)+`<p>${button('← All dialogue chapters','dialogueHome','secondary')}</p>`+`<input id="dialogueSearch" class="searchbox" type="search" placeholder="Search conversations by title or theme…" aria-label="Search dialogues">`+groups(matched,d=>`<button style="width:100%;color:inherit;text-align:left" class="card searchable" data-searchtext="${esc((d.title+' '+d.desc+' '+d.cat).toLowerCase())}" data-dialogue="${d.id}"><div class="row between"><span class="pill">${esc(d.cat)}</span>${state.done.includes(d.id)?'<span style="color:var(--mint)">✓ Completed</span>':''}</div><h3 style="margin-top:12px">${esc(d.title)}</h3><p class="muted">${esc(d.desc)} • ${d.lines.length} turns</p></button>`)}

function itemList(type){let inst=type==='instruments',items=inst?instruments:expressions,title=inst?'Dental Instruments':'Russian Expressions',activeItems=items.filter(x=>(category==='All'||x.cat===category)&&(filter==='All'||(filter==='New'?!state.status[x.id]:state.status[x.id]===filter)));if(!detail)return categoryLanding(type);return heading(esc(category),`${activeItems.length} items • Russian / English / فارسی`)+`<div class="section"><input id="vocabSearch" class="searchbox" type="search" placeholder="Search Russian / English / فارسی ..." aria-label="Search vocabulary"></div>`+`<div class="row" style="margin:10px 0"><button class="action" data-chapter-quiz="1">🧠 Quiz this chapter</button></div>`+filters(['All',...statuses],filter,'filter')+`<p>${button('← All chapters','chapterHome','secondary')}</p>`+`<p class="muted tiny">Showing ${activeItems.length} of ${items.filter(x=>category==='All'||x.cat===category).length} items</p>`+groups(activeItems,x=>`<div class="card searchable" data-searchtext="${esc((x.ru+' '+x.en+' '+(x.fa||'')+' '+x.cat).toLowerCase())}"><div class="item">${inst?`${photoCard(x)}`:''}<div style="flex:1"><span class="pill">${esc(x.cat)}</span><p class="russian" lang="ru">${esc(x.ru)}</p><p class="translation">🇬🇧 ${esc(x.en)}</p>${shownPersian(x.id,x.fa)?`<p class="persian" lang="fa" dir="rtl">🇮🇷 ${esc(shownPersian(x.id,x.fa))}</p>`:'<p class="tiny muted">Persian translation needs review</p>'}<button class="secondary tiny" data-fix-fa="${esc(x.id)}">✎ Edit Persian</button>${inst?`<p class="tiny muted">${esc(x.desc)}</p><a class="photolink" target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/wiki/Special:MediaSearch?type=image&search=${encodeURIComponent(x.en+' dental instrument')}">↗ Search Wikimedia for real photos (check match)</a>`:''}</div></div><div class="row" style="margin-top:12px">${speakButton(x.ru)}${saveButton(x.id)}</div>${statusButtons(x.id)}</div>`) }
function notebook(){let saved=vocab.filter(x=>state.saved.includes(x.id));return heading('My Notebook','Saved vocabulary and your private notes.')+`<h2>★ Saved vocabulary (${saved.length})</h2>`+groups(saved,x=>`<div class="card"><p class="russian" lang="ru">${esc(x.ru)}</p><p class="translation">${esc(x.en)}</p>${shownPersian(x.id,x.fa)?`<p class="persian" dir="rtl" lang="fa">${esc(shownPersian(x.id,x.fa))}</p>`:''}<div class="row">${speakButton(x.ru)}${saveButton(x.id)}</div>${statusButtons(x.id)}</div>`)+`<div class="section card"><h3>New personal note</h3><label for="note">Write a study note</label><textarea id="note" placeholder="e.g. Remember: Подайте = please pass..."></textarea><p>${button('+ Add note','addNote','action')}</p></div><h2>My notes</h2>${groups(state.notes.map((n,i)=>({...n,i})),n=>`<div class="card"><div class="row between"><span class="tiny muted">${esc(n.date)}</span>${button('Delete','deleteNote:'+n.i)}</div><p style="white-space:pre-wrap">${esc(n.text)}</p></div>`)}`}
function plan(){let undone=dialogues.find(x=>!state.done.includes(x.id))||dialogues[0];let reviews=vocab.filter(x=>['Review','Need practice'].includes(state.status[x.id]));return heading('My Study Plan','A simple plan for steady improvement.')+`<div class="card"><h3>How much time do you have today?</h3><div class="chips">${[10,20,30].map(n=>`<button class="chip ${studyMinutes===n?'active':''}" data-minutes="${n}">${n} minutes</button>`).join('')}</div><h3>Today’s suggestion</h3><div class="line"><b>1. Dialogue • ${Math.round(studyMinutes*.45)} min</b><p>${esc(undone.title)}</p>${button('Start dialogue','suggested')}</div><div class="line"><b>2. Vocabulary • ${Math.round(studyMinutes*.35)} min</b><p>Learn 5 items from Instruments or Expressions.</p>${button('Open vocabulary','vocab')}</div><div class="line"><b>3. Quick review • ${studyMinutes-Math.round(studyMinutes*.45)-Math.round(studyMinutes*.35)} min</b><p>${reviews.length} words currently need review.</p>${button('Take quiz','startQuiz')}</div></div><div class="card"><h3>Your progress</h3><p>✓ Completed dialogues: <b>${state.done.length}/${dialogues.length}</b></p><p>✓ Vocabulary mastered: <b>${vocab.filter(x=>state.status[x.id]==='Know it').length}/${vocab.length}</b></p><p>↺ Review items: <b>${reviews.length}</b></p><p>🧠 Quiz accuracy: <b>${state.quizAttempts?Math.round(state.quizCorrect/state.quizAttempts*100)+'%':'No quizzes yet'}</b></p></div><div class="card"><h3>Backup your progress</h3><p class="muted tiny">Progress is stored locally on this device. Export a backup before clearing browser data or changing devices.</p><div class="row">${button('↓ Export backup','export')}${button('↑ Import backup','import')}</div><input id="importFile" class="hide" type="file" accept="application/json,.json"></div>`}
function startQuiz(){
let pool=quizScope==='Tools'?instruments:quizScope==='Expressions'?expressions:vocab;
if(quizCategory!=='All')pool=pool.filter(x=>x.cat===quizCategory);if(quizLanguage==='Persian')pool=pool.filter(x=>x.fa);
let known=pool.filter(x=>state.status[x.id]==='Know it');if(known.length>=4)pool=known;
if(pool.length<4){toast('Not enough translated items in this chapter; try English quiz.');return}
const shuffled=[...pool].sort(()=>Math.random()-.5);
quiz={items:shuffled.slice(0,Math.min(10,shuffled.length)),pool,index:0,score:0};quizFeedback=null;page='quiz';render()
}
function quizPage(){if(!quiz)return heading('Practice Quiz','Choose your topic and translation language.')+`<div class="card"><h3>Choose topic</h3><div class="chips">${['All','Tools','Expressions'].map(s=>`<button class="chip ${quizScope===s?'active':''}" data-quiz-scope="${s}">${s}</button>`).join('')}</div><h3>Choose chapter</h3><select id="quizChapter" aria-label="Quiz chapter"><option value="All">All chapters</option>${[...new Set((quizScope==='Tools'?instruments:quizScope==='Expressions'?expressions:vocab).map(x=>x.cat))].sort().map(c=>`<option value="${esc(c)}" ${quizCategory===c?'selected':''}>${esc(c)}</option>`).join('')}</select><h3>Answer language</h3><div class="chips">${['English','Persian'].map(s=>`<button class="chip ${quizLanguage===s?'active':''}" data-quiz-language="${s}">${s}</button>`).join('')}</div><p class="muted tiny">Questions use reviewed items when possible. Mistakes are saved for revision.</p>${button('Start quiz','startQuiz','action')}</div>`;
if(quiz.index>=quiz.items.length)return heading('Quiz results','Your practice is saved')+`<div class="hero"><h1>${quiz.score} / ${quiz.items.length}</h1><p>Correct answers</p>${button('Try another quiz','startQuiz','action')}${button('Change quiz settings','quizSettings','secondary')}</div>`;
let x=quiz.items[quiz.index],field=quizLanguage==='Persian'?'fa':'en';
if(!quiz.choices||quiz.choiceIndex!==quiz.index){let possible=quiz.pool.filter(v=>v.id!==x.id&&v[field]&&v[field]!==x[field]);quiz.choices=[x,...possible.sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);quiz.choiceIndex=quiz.index}
return heading('Practice Quiz',`Question ${quiz.index+1} of ${quiz.items.length} • Score ${quiz.score}`)+`<div class="card"><p class="muted">What does this mean?</p><p class="russian" lang="ru">${esc(x.ru)}</p>${speakButton(x.ru)}</div><div class="card">${quiz.choices.map(v=>`<button ${quizFeedback?'disabled':''} data-answer="${v.id}" class="quizbtn ${quizFeedback?(v.id===x.id?'correct':v.id===quizFeedback?'wrong':''):''}" ${quizLanguage==='Persian'?'dir="rtl"':''}>${esc(v[field]||v.en)}</button>`).join('')}${quizFeedback?`<div class="notice">${quizFeedback===x.id?'✓ Correct!':'Review this item: '+esc(x[field]||x.en)}</div>${button('Next →','nextQuestion','action')}`:''}</div>`
}
function render(){document.getElementById('main').innerHTML=page==='home'?home():page==='dialogues'?detail&&detail!=='dialogueChapter'?dialogueView():dialogueList():page==='instruments'||page==='expressions'?itemList(page):page==='notebook'?notebook():page==='plan'?plan():quizPage();let links=[['⌂','Home','home'],['💬','Dialogues','dialogues'],['🦷','Tools','instruments'],['🧠','Quiz','quiz'],['📓','Notes','notebook']];document.getElementById('nav').innerHTML=links.map(([ic,t,p])=>`<button class="${page===p?'active':''}" data-go="${p}"><b>${ic}</b>${t}</button>`).join('')}
document.addEventListener('input',e=>{if(!['vocabSearch','dialogueSearch'].includes(e.target?.id))return;let q=e.target.value.toLocaleLowerCase().trim();document.querySelectorAll('.searchable').forEach(c=>{c.hidden=!!q&&!c.dataset.searchtext.includes(q)});});
function updateStatus(id,s){state.status[id]=state.status[id]===s?'New':s;save();render()}function downloadBackup(){let blob=new Blob([JSON.stringify({app:'My Dental Russian',version:1,created:new Date().toISOString(),state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-dental-russian-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
document.addEventListener('click',e=>{let el=e.target.closest('[data-open-category],[data-go],[data-action],[data-dialogue],[data-cat],[data-filter],[data-id],[data-save],[data-speak],[data-minutes],[data-answer],[data-quiz-scope],[data-quiz-language],[data-chapter-quiz],[data-fix-fa]');if(!el)return;if(el.dataset.fixFa){const id=el.dataset.fixFa;const item=vocab.find(x=>x.id===id);let original=item?.fa||'';if(id.startsWith('line-')){const ru=id.slice(5);const line=dialogues.flatMap(d=>d.lines).find(l=>l[1]===ru);original=line?.[3]||'';}editPersian(id,original);return}if(el.dataset.openCategory){category=el.dataset.openCategory;detail=page==='dialogues'?'dialogueChapter':'chapter';filter='All';render();window.scrollTo(0,0);return}if(el.dataset.go){go(el.dataset.go);return}if(el.dataset.dialogue){go('dialogues',el.dataset.dialogue);state.last=el.dataset.dialogue;save();return}if(el.dataset.cat){category=el.dataset.cat;render();return}if(el.dataset.filter){filter=el.dataset.filter;render();return}if(el.dataset.id){updateStatus(el.dataset.id,el.dataset.status);return}if(el.dataset.save){let id=el.dataset.save;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save();render();return}if(el.dataset.speak){speak(decodeURIComponent(el.dataset.speak));return}if(el.dataset.minutes){studyMinutes=Number(el.dataset.minutes);render();return}if(el.dataset.chapterQuiz){quizCategory=category;quizScope=page==='instruments'?'Tools':'Expressions';quiz=null;page='quiz';render();return}if(el.dataset.quizScope){quizCategory='All';quizScope=el.dataset.quizScope;render();return}if(el.dataset.quizLanguage){quizLanguage=el.dataset.quizLanguage;render();return}if(el.dataset.answer){if(quizFeedback)return;let id=el.dataset.answer,x=quiz.items[quiz.index];quizFeedback=id;state.quizAttempts++;if(id===x.id){quiz.score++;state.quizCorrect++}else state.status[x.id]='Review';save();render();return}let a=el.dataset.action;if(!a)return;if(a==='dialogueHome'){detail=null;category='All';render()}else if(a==='chapterHome'){detail=null;category='All';filter='All';render()}else if(a==='browseAll'){category='All';detail='chapter';filter='All';render()}else if(a==='back'){if((page==='instruments'||page==='expressions')&&detail){detail=null;category='All';render()}else if(page==='dialogues'&&detail){detail=null;category='All';render()}else go('home')}else if(a==='continue'){go('dialogues',state.last||dialogues[0].id)}else if(a==='complete'){let id=detail;state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];save();render()}else if(a==='startQuiz')startQuiz();else if(a==='quizSettings'){quiz=null;render()}else if(a==='nextQuestion'){quiz.index++;quizFeedback=null;render()}else if(a==='addNote'){let input=document.getElementById('note'),t=input?.value.trim();if(!t){toast('Write a note first.');return}state.notes.unshift({text:t,date:new Date().toLocaleDateString('en-GB')});save();render()}else if(a.startsWith('deleteNote:')){state.notes.splice(Number(a.split(':')[1]),1);save();render()}else if(a==='export')downloadBackup();else if(a==='import'){document.getElementById('importFile').click()}else if(a==='suggested')go('dialogues',(dialogues.find(x=>!state.done.includes(x.id))||dialogues[0]).id);else if(a==='vocab')go('instruments')});
document.addEventListener('change',async e=>{if(e.target?.id==='quizChapter'){quizCategory=e.target.value;return}if(e.target?.id!=='importFile')return;try{let obj=JSON.parse(await e.target.files[0].text());if(obj.app!=='My Dental Russian'||!obj.state||typeof obj.state!=='object'||!Array.isArray(obj.state.saved)||!Array.isArray(obj.state.notes)||!Array.isArray(obj.state.done))throw Error('Not a valid backup');if(!confirm('Replace your current progress with this backup?'))return;state={...defaultState,...obj.state};save();render();toast('Backup imported.')}catch(err){toast('Could not import this backup.')}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
